# 临时 80 端口配置：仅用于 certbot http-01 首次签发证书。
# 安装位置：/etc/nginx/sites-enabled/sql.example.com
# 签完证书后立刻用 deploy/nginx-site.conf 覆盖本文件。
#
# 说明：LE 首次签发偶发 secondary validation timeout，重试一次通常即成功；
#       deploy/setup-edge.sh 已内置 3 次重试。
server {
    listen 80;
    listen [::]:80;
    server_name sql.example.com;

    location / {
        default_type text/plain;
        return 200 "text2sql bootstrap\n";
    }
}
