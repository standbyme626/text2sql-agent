# ============================================================================
# 边缘服务器 nginx —— HTTPS 反向代理模板（SSE 友好）
#
# 拓扑：
#   浏览器 → 边缘 nginx:443 → 127.0.0.1:${APP_PORT}（SSH 反向隧道）
#          → 应用服务器 127.0.0.1:${APP_PORT} → FastAPI
#
# 用法：
#   DOMAIN=sql.example.com
#   sed "s/sql\.example\.com/${DOMAIN}/g" deploy/nginx-site.conf \
#     | sudo tee /etc/nginx/sites-available/${DOMAIN}
#   sudo ln -sf /etc/nginx/sites-available/${DOMAIN} /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
#   · 应用层已有中文登录页 + HMAC token，nginx Basic 是可选的第二层，默认关闭。
#   · 未配置 AUTH_PASSWORD 时后端拒绝启动（隧道架构下公网可达性与 HOST 无关）。
#   · 证书由 certbot 签发到 /etc/letsencrypt/live/<domain>/；deploy/setup-edge.sh
#     会把续期方式改成 webroot + installer=None，续期不再改写本文件。
# ============================================================================

# 只在客户端真的带 Upgrade 头时才发 Connection: upgrade；普通 HTTP/SSE 不应无条件升级
map $http_upgrade $t2s_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name sql.example.com;
    client_max_body_size 1m;

    # ---- 安全响应头（登录页同样生效）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'" always;

    # 可选第二层鉴权（默认关闭；移动端/预览面板的原生 401 弹窗常不出现，体验差）
    # auth_basic "Text2SQL Agent";
    # auth_basic_user_file /etc/nginx/.htpasswd-text2sql;

    location / {
        proxy_pass http://127.0.0.1:3388;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端自带的 XFF：应用取最后一跳做限流，防止伪造 IP 绕过
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $t2s_connection_upgrade;
        proxy_buffering off;          # SSE 流式输出必须关缓冲
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/sql.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sql.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name sql.example.com;

    # certbot webroot 续期：放行 http-01 挑战，其余一律跳 HTTPS
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# 上线检查清单（deploy/setup-edge.sh 会自动断言前三条）
#   curl -s -o /dev/null -w "%{http_code}" https://<domain>/          → 200（登录页）
#   curl -s -o /dev/null -w "%{http_code}" https://<domain>/api/meta  → 401（鉴权生效）
#   curl -s -o /dev/null -w "%{http_code}" -H "X-App-Token: <token>" \
#        https://<domain>/api/meta                                    → 200
#   certbot renew --dry-run    # 验证续期不会改写本文件
# 应用侧：systemctl is-active text2sql.service text2sql-tunnel.service
# ⚠️ 改动边缘服务器上的任何配置前，先确认这台机器是否还承载其他业务。
# ----------------------------------------------------------------------------
